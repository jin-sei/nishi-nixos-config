source = hyprlock-wallpaper.conf

general {
	hide_cursor = true
	ignore_empty_input = true
}

# GENERAL
general {
  hide_cursor = true
  ignore_empty_input = true
  text_trim = true
}

# TIME HR
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    # color = rgba(255, 255, 255, 1)
    color = rgb(205, 214, 244)
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 150
    font_family = M PLUS 1
    position = 0, -300
    halign = center
    valign = top
    zindex = 5
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    # color = rgba(255, 255, 255, 1)
    color = rgb(205, 214, 244)
    font_size = 150
    font_family = M PLUS 1
    position = 0, -470
    halign = center
    valign = top
    zindex = 5
}
input-field {
	monitor =
	size = 250, 60
	outline_thickness = 1
	dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
	dots_spacing = 0.25 # Scale of dots' absolute size, 0.0 - 1.0
	dots_center = true
	outer_color = rgba(0, 0, 0, 0)
	inner_color = rgba(0, 0, 0, 0.2)
	font_color = rgb(205, 214, 244)
	fade_on_empty = false
	rounding = -1
	placeholder_text = <span foreground="##cdd6f4">Password</span>
	hide_input = false
    	position = 0, -180
	halign = center
	valign = center
	check_color = rgba(0, 0, 0, 0.2)
	fail_color = rgb(243, 139, 168) 
	fail_text =  <b>$ATTEMPTS</b> # can be set to empty
}
